# Kotlin compile daemons (three of them, 6 GB, at 01:07) also stop 10 idle minutes after the last compile. Kotlin docs
# (https://kotlinlang.org/docs/kotlin-daemon.html): autoshutdownIdleSeconds "How long the daemon should stay alive after
# the last compilation when a client is still connected." Default 2 hours; set via org.gradle.jvmargs as the docs show.
org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=autoshutdownIdleSeconds=600
android.useAndroidX=true
kotlin.code.style=official
# Stop the build daemon 10 minutes after the last build instead of the default 3 hours. Gradle docs: "Gradle Daemon will
# terminate itself after a specified number of idle milliseconds. Default is 10800000 (3 hours)."
# https://docs.gradle.org/current/userguide/build_environment.html  - 2026-10-10 01:07 the Mac froze and was forced
# off with an idle daemon from a 00:30 build still holding 5.4 GB of the 16 GB.
org.gradle.daemon.idletimeout=600000
